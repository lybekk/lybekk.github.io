<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to lybekk.tech</title>
  <link rel="canonical" href="https://lybekk.tech/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://lybekk.tech/">
  <script>
    // JS fallback (fires before the meta refresh); carries query + hash along.
    location.replace("https://lybekk.tech/" + location.search + location.hash);
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://lybekk.tech/">lybekk.tech</a>. Redirecting you now&hellip;</p>
</body>
</html>
